{% block danger_modal %}<div class="modal fade" id="dangerModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form id="dangerForm" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="modal-header"><h5 class="modal-title" id="dangerModalTitle">Confirm action</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body" id="dangerModalBody"></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-danger" id="dangerModalConfirm">Confirm</button></div></form></div></div></div><script>document.addEventListener('DOMContentLoaded',function(){var modal=document.getElementById('dangerModal');if(!modal)return;modal.addEventListener('show.bs.modal',function(event){var btn=event.relatedTarget;if(!btn)return;var form=document.getElementById('dangerForm');var title=document.getElementById('dangerModalTitle');var body=document.getElementById('dangerModalBody');var confirm=document.getElementById('dangerModalConfirm');form.setAttribute('action',btn.getAttribute('data-action'));title.textContent=btn.getAttribute('data-title')||'Confirm action';body.textContent=btn.getAttribute('data-message')||'Are you sure?';confirm.textContent=btn.getAttribute('data-confirm-label')||'Confirm';});});</script>{% endblock %}
